name: quran_pak
version: 1.1.0+4
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.6
  get: ^4.7.3
  flutter:
    sdk: flutter
  turn_page_transition: ^0.5.0
  draggable_home: ^1.0.5
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  get_storage: ^2.1.1
  google_fonts: ^8.1.0
  flutter_islamic_icons: ^1.0.2
  geolocator: ^14.0.3
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_compass_v2: ^1.0.3
  # prayers_times: ^0.0.6
  location: ^8.0.1
  geocoding: ^4.0.0
  permission_handler: ^12.0.3
  intl: ^0.19.0
  adhan: ^2.0.0+1
  uicons: ^1.0.1
  connectivity_plus: ^7.2.0
  hijri: ^3.0.0
  bottom_picker: ^4.1.1
  container_tab_indicator: ^0.3.0
  quran_flutter: ^1.0.2
  sticky_headers: ^0.3.0+2
  flutter_advanced_calendar: ^1.4.3
  carousel_slider: ^5.0.0
  scrollable_positioned_list: ^0.3.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # flutter_qiblah_update: ^2.0.3
  # flutter_qiblah: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter: 
  uses-material-design: true

  assets:
    - assets/
    - assets/svg/
    - assets/images/
    - assets/hadith/

flutter_launcher_icons:
  android: launcher_icon
  image_path: "assets/icon.png"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  # Adaptive icon: teal fills the whole tile, white mosque glyph on top.
  adaptive_icon_background: "#13a795"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter_native_splash: 
  color: "#13a795"
  image: "assets/splash.png"
  color_dark: "#13a795"
  image_dark: "assets/splash.png"
  android_12:
    icon_background_color: "#13a795"
    image: "assets/splash.png"
    icon_background_color_dark: "#13a795"
    image_dark: "assets/splash.png"
